<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lobstar-survivor</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #a8d5ba;
            image-rendering: pixelated;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-stats {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .exp-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.5);
            z-index: 5;
        }
        .exp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            transition: width 0.2s ease;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .upgrade-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            padding: 0 20px;
        }
        .upgrade-card {
            background: rgba(30, 30, 50, 0.9);
            border: 2px solid #4a4ae2;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .upgrade-card:hover {
            border-color: #00dbde;
            transform: translateY(-5px);
            background: rgba(40, 40, 70, 0.95);
            box-shadow: 0 10px 25px rgba(0, 219, 222, 0.3);
        }
        .upgrade-card h3 {
            margin-top: 0;
            color: #00dbde;
        }
        .upgrade-card p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="exp-bar-container">
        <div id="expBar" class="exp-bar"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-stats">
                <div>生存時間: <span id="timeDisplay">00:00</span></div>
                <div>擊殺數: <span id="killDisplay">0</span></div>
            </div>
            <div class="hud-stats" style="text-align: right;">
                <div>等級: <span id="levelDisplay">1</span></div>
                <div>生命值: <span id="hpDisplay">100/100</span></div>
            </div>
        </div>
    </div>

    <!-- 開始遊戲畫面 -->
    <div id="startScreen" class="overlay">
        <h1>Lobstar-survivor</h1>
        <p>運用元素精靈的力量，在無盡的魔物浪潮中生存下去！<br>使用 <b>WASD / 方向鍵</b> 移動，或在手機上使用<b>虛擬搖桿</b>滑動。</p>
        <button class="btn" onclick="startGame()">開始冒險</button>
    </div>

    <!-- 升級三選一畫面 -->
    <div id="upgradeScreen" class="overlay hidden">
        <h1>升級！</h1>
        <p>選擇一項你的強化能力：</p>
        <div id="upgradeCards" class="upgrade-grid"></div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">遊戲結束</h1>
        <p id="finalStats">你撐過了 00:00，擊敗了 0 隻怪物。</p>
        <button class="btn" onclick="restartGame()">重新挑戰</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const cameraZoom = isMobile ? 1.0 : 2.0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const playerIdleImages = [];
        const playerAtkImage = new Image();
        playerAtkImage.src = 'Front_atk.png';

        const imgSources = ['Front_idle_01.png', 'Front_idle_02.png'];
        imgSources.forEach((src, index) => {
            const img = new Image();
            img.src = src;
            playerIdleImages[index] = img;
        });

        const bgImage = new Image();
        bgImage.src = 'background_01.png';
        let bgPattern = null;
        bgImage.onload = () => {
            bgPattern = ctx.createPattern(bgImage, 'repeat');
        };

        let gameRunning = false;
        let gamePaused = false;
        let gameTime = 0;
        let killCount = 0;

        let player = {
            worldX: 0,
            worldY: 0,
            radius: 24,
            speed: 3.2,
            maxHp: 100,
            hp: 100,
            level: 1,
            exp: 0,
            maxExp: 20,
            pickupRadius: 90,
            animTimer: 0,
            currentFrame: 0,
            facingRight: false,
            isAttacking: false,
            atkTimer: 0,
            invincibleTimer: 0,
            knockbackX: 0,
            knockbackY: 0,
            currentSkillName: '',
            skillNameTimer: 0
        };

        let weapons = [
            { id: 'fireball', name: '烈焰球', level: 1, maxLevel: 5, cd: 1.2, timer: 0, damage: 25, range: 250 },
            { id: 'lightning', name: '閃電鏈', level: 0, maxLevel: 5, cd: 2.0, timer: 0, damage: 40, range: 300 },
            { id: 'blade', name: '防護水環', level: 0, maxLevel: 5, cd: 0.3, timer: 0, damage: 12, range: 120 }
        ];

        let passives = [
            { id: 'haste', name: '疾風靴', level: 0, maxLevel: 5, desc: '移動速度提升 10%' },
            { id: 'power', name: '力量寶珠', level: 0, maxLevel: 5, desc: '攻擊傷害提升 15%' },
            { id: 'magnet', name: '吸引磁鐵', level: 0, maxLevel: 5, desc: '經驗吸收範圍擴大 30%' }
        ];

        let enemies = [];
        let bullets = [];
        let particles = [];
        let gems = [];
        let floatTexts = [];

        let keys = {};
        let joystick = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0 };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('pointerdown', e => {
            if (!gameRunning || gamePaused) return;
            joystick.active = true;
            joystick.id = e.pointerId;
            joystick.startX = e.clientX;
            joystick.startY = e.clientY;
            joystick.x = e.clientX;
            joystick.y = e.clientY;
        });

        window.addEventListener('pointermove', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.x = e.clientX;
                joystick.y = e.clientY;
            }
        });

        window.addEventListener('pointerup', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.active = false;
            }
        });

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.worldX = 0;
            player.worldY = 0;
            player.hp = player.maxHp;
            player.level = 1;
            player.exp = 0;
            player.maxExp = 20;
            player.animTimer = 0;
            player.currentFrame = 0;
            player.facingRight = false;
            player.isAttacking = false;
            player.atkTimer = 0;
            player.invincibleTimer = 0;
            player.knockbackX = 0;
            player.knockbackY = 0;
            player.currentSkillName = '';
            player.skillNameTimer = 0;
            gameTime = 0;
            killCount = 0;
            enemies = [];
            bullets = [];
            particles = [];
            gems = [];
            floatTexts = [];

            weapons.forEach(w => {
                w.level = (w.id === 'fireball' ? 1 : 0);
                w.timer = 0;
            });
            passives.forEach(p => p.level = 0);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('levelDisplay').innerText = player.level;
            document.getElementById('hpDisplay').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('killDisplay').innerText = killCount;
            const minutes = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const seconds = String(Math.floor(gameTime % 60)).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${minutes}:${seconds}`;
            
            const expPercent = (player.exp / player.maxExp) * 100;
            document.getElementById('expBar').style.width = `${expPercent}%`;
        }

        const dt = 1 / 60;
        let accumulatedTime = 0;
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            if (!lastTimestamp) lastTimestamp = timestamp;
            let frameTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (frameTime > 0.25) frameTime = 0.25;
            accumulatedTime += frameTime;

            while (accumulatedTime >= dt) {
                if (!gamePaused) {
                    update(dt);
                }
                accumulatedTime -= dt;
            }

            if (!gamePaused) {
                render();
            }

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameTime += dt;
            if (Math.floor(gameTime * 10) % 10 === 0) {
                updateHUD();
            }

            if (player.invincibleTimer > 0) {
                player.invincibleTimer -= dt;
            }

            if (player.skillNameTimer > 0) {
                player.skillNameTimer -= dt;
                if (player.skillNameTimer <= 0) {
                    player.currentSkillName = '';
                }
            }

            player.worldX += player.knockbackX;
            player.worldY += player.knockbackY;
            player.knockbackX *= 0.85;
            player.knockbackY *= 0.85;

            if (player.isAttacking) {
                player.atkTimer -= dt;
                if (player.atkTimer <= 0) {
                    player.isAttacking = false;
                }
            }

            player.animTimer += dt;
            if (player.animTimer >= 0.5) {
                player.animTimer = 0;
                player.currentFrame = (player.currentFrame + 1) % 2;
            }

            let moveX = 0;
            let moveY = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (joystick.active) {
                let dx = joystick.x - joystick.startX;
                let dy = joystick.y - joystick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 5) {
                    moveX = dx / dist;
                    moveY = dy / dist;
                }
            }

            if (moveX > 0) player.facingRight = true;
            if (moveX < 0) player.facingRight = false;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            let currentSpeed = player.speed * (1 + passives.find(p => p.id === 'haste').level * 0.1);
            player.worldX += moveX * currentSpeed;
            player.worldY += moveY * currentSpeed;

            let spawnRate = gameTime < 120 ? 0.018 : (0.035 + gameTime * 0.0008);
            if (Math.random() < spawnRate) {
                spawnEnemy();
            }

            weapons.forEach(weapon => {
                if (weapon.level <= 0) return;
                weapon.timer += dt;
                if (weapon.timer >= weapon.cd) {
                    weapon.timer = 0;
                    activateWeapon(weapon);
                }
            });

            // 防護水環（水環攻擊判定與蒸發反應）
            let bladeW = weapons.find(w => w.id === 'blade');
            if (bladeW && bladeW.level > 0) {
                let bladeCount = 2 + bladeW.level;
                for (let i = 0; i < bladeCount; i++) {
                    let angle = (gameTime * 3) + (Math.PI * 2 / bladeCount) * i;
                    let bx = player.worldX + Math.cos(angle) * 75;
                    let by = player.worldY + Math.sin(angle) * 75;

                    if (Math.random() < 0.4) {
                        particles.push({
                            type: 'spark',
                            worldX: bx + (Math.random() - 0.5) * 10,
                            worldY: by + (Math.random() - 0.5) * 10,
                            vx: (Math.random() - 0.5) * 1.2,
                            vy: (Math.random() - 0.5) * 1.2,
                            life: 0.3,
                            color: Math.random() > 0.5 ? '#29b6f6' : '#80d8ff'
                        });
                    }

                    enemies.forEach(e => {
                        if (Math.hypot(bx - e.x, by - e.y) < e.radius + 15) {
                            if (!e.lastBladeHit || gameTime - e.lastBladeHit > 0.25) {
                                e.lastBladeHit = gameTime;
                                let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                                let baseDmg = (bladeW.damage + bladeW.level * 4) * powerBonus;
                                let finalDmg = Math.floor(baseDmg);

                                // 蒸發反應判定：如果在燃燒狀態被防護水環攻擊
                                if (e.burnTimer > 0) {
                                    e.burnTimer = 0; // 解除燃燒狀態
                                    finalDmg *= 2; // 2倍傷害

                                    let outAngle = Math.atan2(e.y - player.worldY, e.x - player.worldX) + (Math.random() - 0.5) * 0.5;
                                    floatTexts.push({
                                        worldX: e.x,
                                        worldY: e.y - 15,
                                        vx: Math.cos(outAngle) * 1.5,
                                        vy: -2.8,
                                        gravity: 0.15,
                                        text: '蒸發',
                                        color: '#ff5722',
                                        life: 1.0,
                                        maxLife: 1.0
                                    });
                                }

                                e.hp -= finalDmg;

                                let outAngle = Math.atan2(e.y - player.worldY, e.x - player.worldX) + (Math.random() - 0.5) * 0.5;
                                floatTexts.push({
                                    worldX: e.x,
                                    worldY: e.y,
                                    vx: Math.cos(outAngle) * 1.5,
                                    vy: -2.5,
                                    gravity: 0.15,
                                    text: finalDmg,
                                    color: '#29b6f6',
                                    life: 1.0,
                                    maxLife: 1.0
                                });
                                
                                let kbAngle = Math.atan2(e.y - player.worldY, e.x - player.worldX);
                                e.x += Math.cos(kbAngle) * 15;
                                e.y += Math.sin(kbAngle) * 15;
                            }
                        }
                    });
                }
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        killCount++;
                        gems.push({ x: enemies[i].x, y: enemies[i].y, value: enemies[i].expVal });
                        enemies.splice(i, 1);
                    }
                }
            }

            // 敵人更新（包含燃燒狀態計時與每秒 2% 最大生命值傷害）
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];

                if (e.burnTimer > 0) {
                    e.burnTimer -= dt;
                    e.burnTickTimer += dt;
                    if (e.burnTickTimer >= 1.0) {
                        e.burnTickTimer = 0;
                        let burnDmg = Math.max(1, Math.floor(e.maxHp * 0.02));
                        e.hp -= burnDmg;

                        let outAngle = (Math.random() - 0.5) * Math.PI;
                        floatTexts.push({
                            worldX: e.x,
                            worldY: e.y,
                            vx: Math.cos(outAngle) * 1.2,
                            vy: -2.2,
                            gravity: 0.15,
                            text: burnDmg,
                            color: '#ff7043',
                            life: 1.0,
                            maxLife: 1.0
                        });
                    }
                }

                let angle = Math.atan2(player.worldY - e.y, player.worldX - e.x);

                if (e.isJumper) {
                    e.jumpTimer += dt;
                    if (e.jumpTimer >= 1.0) {
                        e.jumpTimer = 0;
                        e.isJumping = true;
                        e.jumpProgress = 0;
                    }

                    if (e.isJumping) {
                        e.jumpProgress += dt * 3;
                        e.x += Math.cos(angle) * e.speed * 2.2;
                        e.y += Math.sin(angle) * e.speed * 2.2;
                        e.visualHeight = Math.sin(e.jumpProgress * Math.PI) * 18;

                        if (e.jumpProgress >= 1.0) {
                            e.isJumping = false;
                            e.visualHeight = 0;
                        }
                    } else {
                        e.visualHeight = 0;
                        e.x += Math.cos(angle) * e.speed * 0.3;
                        e.y += Math.sin(angle) * e.speed * 0.3;
                    }
                } else {
                    e.visualHeight = 0;
                    e.x += Math.cos(angle) * e.speed;
                    e.y += Math.sin(angle) * e.speed;
                }

                let distToPlayer = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    if (player.invincibleTimer <= 0) {
                        let damageTaken = Math.ceil(e.damage * 0.8);
                        player.hp -= damageTaken;
                        player.invincibleTimer = 0.5;

                        let pushAngle = Math.atan2(player.worldY - e.y, player.worldX - e.x);
                        player.knockbackX = Math.cos(pushAngle) * 4.5;
                        player.knockbackY = Math.sin(pushAngle) * 4.5;

                        let outAngle = pushAngle + (Math.random() - 0.5) * 0.8;
                        floatTexts.push({
                            worldX: player.worldX,
                            worldY: player.worldY - 20,
                            vx: Math.cos(outAngle) * 1.5,
                            vy: -2.8,
                            gravity: 0.15,
                            text: `-${damageTaken}`,
                            color: '#ff3333',
                            life: 1.0,
                            maxLife: 1.0
                        });

                        if (player.hp <= 0) {
                            gameOver();
                        }
                    }
                }
            }

            // 子彈更新（烈焰球使敵人燃燒）
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life -= dt;

                if (b.id === 'fireball' && Math.random() < 0.6) {
                    particles.push({
                        type: 'spark',
                        worldX: b.x + (Math.random() - 0.5) * 10,
                        worldY: b.y + (Math.random() - 0.5) * 10,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        life: 0.3,
                        color: Math.random() > 0.5 ? '#ff7043' : '#ffca28'
                    });
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                        let finalDmg = Math.floor(b.damage * powerBonus);
                        e.hp -= finalDmg;

                        // 烈焰球命中賦予燃燒狀態（持續 2 秒，再次受到刷新時間）
                        if (b.id === 'fireball') {
                            e.burnTimer = 2.0;
                            e.burnTickTimer = 0;
                        }
                        
                        let outAngle = Math.atan2(e.y - b.y, e.x - b.x) + (Math.random() - 0.5) * 0.5;
                        floatTexts.push({
                            worldX: e.x,
                            worldY: e.y,
                            vx: Math.cos(outAngle) * 1.5,
                            vy: -2.5,
                            gravity: 0.15,
                            text: finalDmg,
                            color: b.color,
                            life: 1.0,
                            maxLife: 1.0
                        });

                        let kbAngle = Math.atan2(e.y - b.y, e.x - b.x);
                        e.x += Math.cos(kbAngle) * 20;
                        e.y += Math.sin(kbAngle) * 20;

                        if (e.hp <= 0) {
                            killCount++;
                            gems.push({ x: e.x, y: e.y, value: e.expVal });
                            enemies.splice(j, 1);
                        }

                        if (!b.pierce) {
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }

                if (b.life <= 0 && i < bullets.length) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (p.type === 'spark') {
                    p.worldX += p.vx;
                    p.worldY += p.vy;
                    p.life -= dt;
                    if (p.life <= 0) particles.splice(i, 1);
                } else if (p.type === 'lightning') {
                    p.life -= 0.016;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.worldX += ft.vx;
                ft.worldY += ft.vy;
                ft.vy += ft.gravity;
                ft.life -= dt;
                if (ft.life <= 0) floatTexts.splice(i, 1);
            }

            let pickupRangeBase = player.pickupRadius * (1 + passives.find(p => p.id === 'magnet').level * 0.3);
            for (let i = gems.length - 1; i >= 0; i--) {
                let g = gems[i];
                let dist = Math.hypot(player.worldX - g.x, player.worldY - g.y);
                if (dist < pickupRangeBase) {
                    let angle = Math.atan2(player.worldY - g.y, player.worldX - g.x);
                    g.x += Math.cos(angle) * 7;
                    g.y += Math.sin(angle) * 7;

                    if (dist < player.radius + 10) {
                        addExp(g.value);
                        gems.splice(i, 1);
                    }
                }
            }
        }

        function spawnEnemy() {
            let angle = Math.random() * Math.PI * 2;
            let spawnDist = Math.max(canvas.width, canvas.height) * 0.5 + Math.random() * 150;
            let x = player.worldX + Math.cos(angle) * spawnDist;
            let y = player.worldY + Math.sin(angle) * spawnDist;

            let typeRand = Math.random();
            let hp, speed, radius, color, expVal, damage, isJumper;

            let isEarlyGame = gameTime < 120;
            let earlyMult = isEarlyGame ? 0.35 : 0.7;

            if (typeRand < 0.6) {
                hp = (20 + gameTime * 0.8) * earlyMult;
                speed = 1.0 * (isEarlyGame ? 0.8 : 1.0);
                radius = 16;
                color = '#ff5252';
                expVal = 1;
                damage = 12;
                isJumper = false;
            } else if (typeRand < 0.9) {
                hp = (15 + gameTime * 0.5) * earlyMult;
                speed = 1.8 * (isEarlyGame ? 0.8 : 1.0);
                radius = 12;
                color = '#ffeb3b';
                expVal = 2;
                damage = 10;
                isJumper = true;
            } else {
                hp = (60 + gameTime * 2.5) * earlyMult;
                speed = 1.1 * (isEarlyGame ? 0.8 : 1.0);
                radius = 28;
                color = '#ab47bc';
                expVal = 5;
                damage = 20;
                isJumper = true;
            }

            enemies.push({ 
                x, y, hp, maxHp: hp, speed, radius, color, expVal, damage, 
                isJumper, 
                jumpTimer: Math.random() * 1.0, 
                isJumping: false, 
                jumpProgress: 0,
                visualHeight: 0,
                burnTimer: 0,
                burnTickTimer: 0
            });
        }

        function activateWeapon(weapon) {
            if (enemies.length === 0) return;

            let target = null;
            let minDist = Infinity;
            enemies.forEach(e => {
                let dist = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                if (dist < minDist && dist < weapon.range * 1.5) {
                    minDist = dist;
                    target = e;
                }
            });

            if (!target && enemies.length > 0) target = enemies[0];
            if (!target) return;

            if (weapon.id === 'fireball' || weapon.id === 'lightning') {
                player.currentSkillName = weapon.name;
                player.skillNameTimer = 0.6;
            }

            if (weapon.id === 'fireball') {
                player.isAttacking = true;
                player.atkTimer = 0.25;

                let angle = Math.atan2(target.y - player.worldY, target.x - player.worldX);
                let count = weapon.level >= 3 ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    let offsetAngle = angle + (i === 0 ? 0 : (i % 2 === 0 ? 0.2 : -0.2));
                    bullets.push({
                        id: 'fireball',
                        x: player.worldX,
                        y: player.worldY,
                        vx: Math.cos(offsetAngle) * 6,
                        vy: Math.sin(offsetAngle) * 6,
                        damage: weapon.damage + weapon.level * 8,
                        radius: 10,
                        life: 2.0,
                        color: '#ff7043',
                        pierce: false
                    });
                }
            } else if (weapon.id === 'lightning') {
                let affectedCount = 2 + weapon.level;
                let hitCount = 0;
                enemies.forEach(e => {
                    let dist = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                    if (hitCount < affectedCount && dist < weapon.range) {
                        let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                        let finalDmg = Math.floor((weapon.damage + weapon.level * 10) * powerBonus);
                        e.hp -= finalDmg;
                        
                        let outAngle = Math.atan2(e.y - player.worldY, e.x - player.worldX) + (Math.random() - 0.5) * 0.5;
                        floatTexts.push({
                            worldX: e.x,
                            worldY: e.y,
                            vx: Math.cos(outAngle) * 1.5,
                            vy: -2.5,
                            gravity: 0.15,
                            text: finalDmg,
                            color: '#40c4ff',
                            life: 1.0,
                            maxLife: 1.0
                        });
                        
                        let kbAngle = Math.atan2(e.y - player.worldY, e.x - player.worldX);
                        e.x += Math.cos(kbAngle) * 18;
                        e.y += Math.sin(kbAngle) * 18;

                        particles.push({ type: 'lightning', worldX1: player.worldX, worldY1: player.worldY, worldX2: e.x, worldY2: e.y, life: 0.45 });

                        if (e.hp <= 0) {
                            killCount++;
                            gems.push({ x: e.x, y: e.y, value: e.expVal });
                        }
                        hitCount++;
                    }
                });
                enemies = enemies.filter(e => e.hp > 0);
            }
        }

        function addExp(val) {
            player.exp += val;
            if (player.exp >= player.maxExp) {
                player.exp -= player.maxExp;
                player.level++;
                player.maxExp = Math.floor(player.maxExp * 1.3);
                triggerLevelUp();
            }
            updateHUD();
        }

        function triggerLevelUp() {
            gamePaused = true;
            let availableChoices = [];
            weapons.forEach(w => {
                if (w.level < w.maxLevel) availableChoices.push({ type: 'weapon', item: w });
            });
            passives.forEach(p => {
                if (p.level < p.maxLevel) availableChoices.push({ type: 'passive', item: p });
            });

            availableChoices.sort(() => Math.random() - 0.5);
            let options = availableChoices.slice(0, 3);

            let container = document.getElementById('upgradeCards');
            container.innerHTML = '';

            if (options.length === 0) {
                player.hp = player.maxHp;
                gamePaused = false;
                return;
            }

            options.forEach(opt => {
                let card = document.createElement('div');
                card.className = 'upgrade-card';
                let title = opt.item.name;
                let desc = opt.type === 'weapon' ? `提升等級至 Lv.${opt.item.level + 1}` : opt.item.desc;
                if (opt.item.level === 0) title += ' (解鎖!)';

                card.innerHTML = `<h3>${title}</h3><p>${desc}</p>`;
                card.onclick = () => {
                    opt.item.level++;
                    player.hp = player.maxHp;
                    document.getElementById('upgradeScreen').classList.add('hidden');
                    gamePaused = false;
                    lastTimestamp = performance.now();
                    requestAnimationFrame(gameLoop);
                };
                container.appendChild(card);
            });

            document.getElementById('upgradeScreen').classList.remove('hidden');
        }

        function gameOver() {
            gameRunning = false;
            const minutes = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const seconds = String(Math.floor(gameTime % 60)).padStart(2, '0');
            document.getElementById('finalStats').innerText = `你撐過了 ${minutes}:${seconds}，擊敗了 ${killCount} 隻怪物。`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.scale(cameraZoom, cameraZoom);

            let scaledWidth = canvas.width / cameraZoom;
            let scaledHeight = canvas.height / cameraZoom;
            let camX = player.worldX - scaledWidth / 2;
            let camY = player.worldY - scaledHeight / 2;

            ctx.save();
            if (bgPattern) {
                ctx.fillStyle = bgPattern;
                ctx.translate(-camX, -camY);
                ctx.fillRect(camX, camY, scaledWidth, scaledHeight);
            } else {
                ctx.fillStyle = '#a8d5ba';
                ctx.fillRect(0, 0, scaledWidth, scaledHeight);
            }
            ctx.restore();

            gems.forEach(g => {
                let screenX = g.x - camX;
                let screenY = g.y - camY;
                if (screenX >= -20 && screenX <= scaledWidth + 20 && screenY >= -20 && screenY <= scaledHeight + 20) {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(screenX - 5, screenY - 5, 10, 10);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(screenX - 5, screenY - 5, 10, 10);
                }
            });

            // 繪製敵人（若處於燃燒狀態，身周會帶有橘紅色火焰燃燒特效）
            enemies.forEach(e => {
                let screenX = e.x - camX;
                let screenY = (e.y - camY) - (e.visualHeight || 0);
                if (screenX >= -50 && screenX <= scaledWidth + 50 && screenY >= -50 && screenY <= scaledHeight + 50) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(e.x - camX, e.y - camY, e.radius * 0.8, e.radius * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    let size = e.radius * 1.8;
                    ctx.fillStyle = e.color;
                    ctx.fillRect(screenX - size / 2, screenY - size / 2, size, size);
                    ctx.strokeStyle = '#4a2e18';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX - size / 2, screenY - size / 2, size, size);

                    // 燃燒狀態特效指示
                    if (e.burnTimer > 0) {
                        ctx.fillStyle = '#ff3d00';
                        ctx.fillRect(screenX - size / 2 - 4, screenY - size / 2 - 8, 8, 8);
                    }
                }
            });

            let playerScreenX = scaledWidth / 2;
            let playerScreenY = scaledHeight / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(playerScreenX, playerScreenY + player.radius * 0.5, player.radius * 0.9, player.radius * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            let shouldDrawPlayer = true;
            if (player.invincibleTimer > 0) {
                shouldDrawPlayer = Math.floor(player.invincibleTimer * 20) % 2 === 0;
            }

            if (shouldDrawPlayer) {
                let currentImg = player.isAttacking ? playerAtkImage : playerIdleImages[player.currentFrame];

                if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {
                    const renderSize = 64;
                    ctx.save();
                    ctx.translate(playerScreenX, playerScreenY);
                    
                    if (player.facingRight) {
                        ctx.scale(-1, 1);
                    }

                    ctx.drawImage(
                        currentImg,
                        -renderSize / 2,
                        -renderSize / 2,
                        renderSize,
                        renderSize
                    );
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#4cd137';
                    ctx.fillRect(playerScreenX - player.radius, playerScreenY - player.radius, player.radius * 2, player.radius * 2);
                }
            }

            if (player.currentSkillName) {
                ctx.font = 'bold 12px sans-serif';
                let textMetrics = ctx.measureText(player.currentSkillName);
                let textWidth = textMetrics.width;
                let boxPaddingX = 8;
                let boxWidth = textWidth + boxPaddingX * 2;
                let boxHeight = 20;
                let boxX = playerScreenX - boxWidth / 2;
                let boxY = playerScreenY - player.radius - 35;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.currentSkillName, playerScreenX, boxY + boxHeight / 2);
            }

            let hpBarWidth = 40;
            let hpBarHeight = 6;
            let hpPercent = Math.max(0, player.hp / player.maxHp);
            let barX = playerScreenX - hpBarWidth / 2;
            let barY = playerScreenY + player.radius + 8;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(barX - 1, barY - 1, hpBarWidth + 2, hpBarHeight + 2);
            ctx.fillStyle = '#ff416c';
            ctx.fillRect(barX, barY, hpBarWidth, hpBarHeight);
            ctx.fillStyle = '#4cd137';
            ctx.fillRect(barX, barY, hpBarWidth * hpPercent, hpBarHeight);

            let bladeW = weapons.find(w => w.id === 'blade');
            if (bladeW && bladeW.level > 0) {
                let bladeCount = 2 + bladeW.level;
                for (let i = 0; i < bladeCount; i++) {
                    let angle = (gameTime * 3) + (Math.PI * 2 / bladeCount) * i;
                    let bx = playerScreenX + Math.cos(angle) * 75;
                    let by = playerScreenY + Math.sin(angle) * 75;
                    
                    ctx.fillStyle = '#29b6f6';
                    ctx.fillRect(bx - 8, by - 8, 16, 16);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(bx - 8, by - 8, 16, 16);
                }
            }

            bullets.forEach(b => {
                let screenX = b.x - camX;
                let screenY = b.y - camY;
                ctx.fillStyle = b.color;
                ctx.fillRect(screenX - b.radius, screenY - b.radius, b.radius * 2, b.radius * 2);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(screenX - b.radius, screenY - b.radius, b.radius * 2, b.radius * 2);
            });

            particles.forEach(p => {
                if (p.type === 'spark') {
                    let sx = p.worldX - camX;
                    let sy = p.worldY - camY;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(sx - 2, sy - 2, 4, 4);
                } else if (p.type === 'lightning') {
                    let sx1 = p.worldX1 - camX;
                    let sy1 = p.worldY1 - camY;
                    let sx2 = p.worldX2 - camX;
                    let sy2 = p.worldY2 - camY;
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1);
                    ctx.lineTo(sx2, sy2);
                    ctx.stroke();
                }
            });

            // 傷害數字與「蒸發」字體渲染（2倍大小、黑色外框線、1秒生命週期）
            floatTexts.forEach(ft => {
                let screenX = ft.worldX - camX;
                let screenY = ft.worldY - camY;
                let alpha = Math.max(0, ft.life / ft.maxLife); // 1秒內從1漸變成0
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = 'bold 26px sans-serif'; // 2倍大小
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';

                // 黑色外框線（描邊）
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText(ft.text, screenX, screenY);

                // 內部文字顏色
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, screenX, screenY);
                ctx.restore();
            });

            ctx.restore();

            if (joystick.active) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 40, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(joystick.x, joystick.y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    </script>
