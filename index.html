<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lobstar-survivor</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #a8d5ba;
            image-rendering: pixelated; /* 保持像素銳利不模糊 */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-stats {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .exp-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.5);
            z-index: 5;
        }
        .exp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            transition: width 0.2s ease;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .upgrade-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            padding: 0 20px;
        }
        .upgrade-card {
            background: rgba(30, 30, 50, 0.9);
            border: 2px solid #4a4ae2;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .upgrade-card:hover {
            border-color: #00dbde;
            transform: translateY(-5px);
            background: rgba(40, 40, 70, 0.95);
            box-shadow: 0 10px 25px rgba(0, 219, 222, 0.3);
        }
        .upgrade-card h3 {
            margin-top: 0;
            color: #00dbde;
        }
        .upgrade-card p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="exp-bar-container">
        <div id="expBar" class="exp-bar"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-stats">
                <div>生存時間: <span id="timeDisplay">00:00</span></div>
                <div>擊殺數: <span id="killDisplay">0</span></div>
            </div>
            <div class="hud-stats" style="text-align: right;">
                <div>等級: <span id="levelDisplay">1</span></div>
                <div>生命值: <span id="hpDisplay">100/100</span></div>
            </div>
        </div>
    </div>

    <!-- 開始遊戲畫面 -->
    <div id="startScreen" class="overlay">
        <h1>Lobstar-survivor</h1>
        <p>運用元素精靈的力量，在無盡的魔物浪潮中生存下去！<br>使用 <b>WASD / 方向鍵</b> 移動，或在手機上使用<b>虛擬搖桿</b>滑動。</p>
        <button class="btn" onclick="startGame()">開始冒險</button>
    </div>

    <!-- 升級三選一畫面 -->
    <div id="upgradeScreen" class="overlay hidden">
        <h1>升級！</h1>
        <p>選擇一項你的強化能力：</p>
        <div id="upgradeCards" class="upgrade-grid"></div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">遊戲結束</h1>
        <p id="finalStats">你撐過了 00:00，擊敗了 0 隻怪物。</p>
        <button class="btn" onclick="restartGame()">重新挑戰</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 載入圖片資源
        const playerIdleImages = [];
        const playerAtkImage = new Image();
        playerAtkImage.src = 'Front_atk.png';

        const imgSources = ['Front_idle_01.png', 'Front_idle_02.png'];
        imgSources.forEach((src, index) => {
            const img = new Image();
            img.src = src;
            playerIdleImages[index] = img;
        });

        // 載入背景拼貼圖
        const bgImage = new Image();
        bgImage.src = 'background_01.png';
        let bgPattern = null;
        bgImage.onload = () => {
            bgPattern = ctx.createPattern(bgImage, 'repeat');
        };

        let gameRunning = false;
        let gamePaused = false;
        let gameTime = 0;
        let killCount = 0;

        // 玩家物件
        let player = {
            worldX: 0,
            worldY: 0,
            radius: 24,
            speed: 3.2, // 固定的基礎移動速度
            maxHp: 100,
            hp: 100,
            level: 1,
            exp: 0,
            maxExp: 20,
            pickupRadius: 90,
            animTimer: 0,
            currentFrame: 0,
            facingRight: false,
            isAttacking: false,
            atkTimer: 0
        };

        let weapons = [
            { id: 'fireball', name: '烈焰球', level: 1, maxLevel: 5, cd: 1.2, timer: 0, damage: 25, range: 250 },
            { id: 'lightning', name: '閃電鏈', level: 0, maxLevel: 5, cd: 2.0, timer: 0, damage: 40, range: 300 },
            { id: 'blade', name: '旋風劍刃', level: 0, maxLevel: 5, cd: 0.3, timer: 0, damage: 12, range: 120 }
        ];

        let passives = [
            { id: 'haste', name: '疾風靴', level: 0, maxLevel: 5, desc: '移動速度提升 10%' },
            { id: 'power', name: '力量寶珠', level: 0, maxLevel: 5, desc: '攻擊傷害提升 15%' },
            { id: 'magnet', name: '吸引磁鐵', level: 0, maxLevel: 5, desc: '經驗吸收範圍擴大 30%' }
        ];

        let enemies = [];
        let bullets = [];
        let particles = [];
        let gems = [];
        let floatTexts = [];

        let keys = {};
        let joystick = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0 };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('pointerdown', e => {
            if (!gameRunning || gamePaused) return;
            joystick.active = true;
            joystick.id = e.pointerId;
            joystick.startX = e.clientX;
            joystick.startY = e.clientY;
            joystick.x = e.clientX;
            joystick.y = e.clientY;
        });

        window.addEventListener('pointermove', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.x = e.clientX;
                joystick.y = e.clientY;
            }
        });

        window.addEventListener('pointerup', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.active = false;
            }
        });

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.worldX = 0;
            player.worldY = 0;
            player.hp = player.maxHp;
            player.level = 1;
            player.exp = 0;
            player.maxExp = 20;
            player.animTimer = 0;
            player.currentFrame = 0;
            player.facingRight = false;
            player.isAttacking = false;
            player.atkTimer = 0;
            gameTime = 0;
            killCount = 0;
            enemies = [];
            bullets = [];
            particles = [];
            gems = [];
            floatTexts = [];

            weapons.forEach(w => {
                w.level = (w.id === 'fireball' ? 1 : 0);
                w.timer = 0;
            });
            passives.forEach(p => p.level = 0);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('levelDisplay').innerText = player.level;
            document.getElementById('hpDisplay').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('killDisplay').innerText = killCount;
            const minutes = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const seconds = String(Math.floor(gameTime % 60)).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${minutes}:${seconds}`;
            
            const expPercent = (player.exp / player.maxExp) * 100;
            document.getElementById('expBar').style.width = `${expPercent}%`;
        }

        // 固定時間步長迴圈，確保速度絕對不會隨等級或幀率變快
        const dt = 1 / 60;
        let accumulatedTime = 0;
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            if (!lastTimestamp) lastTimestamp = timestamp;
            let frameTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (frameTime > 0.25) frameTime = 0.25;
            accumulatedTime += frameTime;

            while (accumulatedTime >= dt) {
                if (!gamePaused) {
                    update(dt);
                }
                accumulatedTime -= dt;
            }

            if (!gamePaused) {
                render();
            }

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            gameTime += dt;
            if (Math.floor(gameTime * 10) % 10 === 0) {
                updateHUD();
            }

            if (player.isAttacking) {
                player.atkTimer -= dt;
                if (player.atkTimer <= 0) {
                    player.isAttacking = false;
                }
            }

            player.animTimer += dt;
            if (player.animTimer >= 0.5) {
                player.animTimer = 0;
                player.currentFrame = (player.currentFrame + 1) % 2;
            }

            let moveX = 0;
            let moveY = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (joystick.active) {
                let dx = joystick.x - joystick.startX;
                let dy = joystick.y - joystick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 5) {
                    moveX = dx / dist;
                    moveY = dy / dist;
                }
            }

            if (moveX > 0) player.facingRight = true;
            if (moveX < 0) player.facingRight = false;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            let currentSpeed = player.speed * (1 + passives.find(p => p.id === 'haste').level * 0.1);
            player.worldX += moveX * currentSpeed;
            player.worldY += moveY * currentSpeed;

            let spawnRate = gameTime < 120 ? 0.012 : (0.025 + gameTime * 0.0005);
            if (Math.random() < spawnRate) {
                spawnEnemy();
            }

            weapons.forEach(weapon => {
                if (weapon.level <= 0) return;
                weapon.timer += dt;
                if (weapon.timer >= weapon.cd) {
                    weapon.timer = 0;
                    activateWeapon(weapon);
                }
            });

            // 旋風劍刃判定
            let bladeW = weapons.find(w => w.id === 'blade');
            if (bladeW && bladeW.level > 0) {
                let bladeCount = 2 + bladeW.level;
                for (let i = 0; i < bladeCount; i++) {
                    let angle = (gameTime * 3) + (Math.PI * 2 / bladeCount) * i;
                    let bx = player.worldX + Math.cos(angle) * 75;
                    let by = player.worldY + Math.sin(angle) * 75;

                    enemies.forEach(e => {
                        if (Math.hypot(bx - e.x, by - e.y) < e.radius + 15) {
                            if (!e.lastBladeHit || gameTime - e.lastBladeHit > 0.25) {
                                e.lastBladeHit = gameTime;
                                let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                                let finalDmg = Math.floor((bladeW.damage + bladeW.level * 4) * powerBonus);
                                e.hp -= finalDmg;
                                floatTexts.push({ worldX: e.x, worldY: e.y, text: finalDmg, color: '#b0bec5', life: 0.4 });
                            }
                        }
                    });
                }
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        killCount++;
                        gems.push({ x: enemies[i].x, y: enemies[i].y, value: enemies[i].expVal });
                        enemies.splice(i, 1);
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let angle = Math.atan2(player.worldY - e.y, player.worldX - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                let distToPlayer = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    player.hp -= e.damage * dt;
                    if (player.hp <= 0) {
                        gameOver();
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life -= dt;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                        let finalDmg = Math.floor(b.damage * powerBonus);
                        e.hp -= finalDmg;
                        
                        floatTexts.push({ worldX: e.x, worldY: e.y, text: finalDmg, color: b.color, life: 0.6 });

                        if (e.hp <= 0) {
                            killCount++;
                            gems.push({ x: e.x, y: e.y, value: e.expVal });
                            enemies.splice(j, 1);
                        }

                        if (!b.pierce) {
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }

                if (b.life <= 0 && i < bullets.length) {
                    bullets.splice(i, 1);
                }
            }

            let pickupRangeBase = player.pickupRadius * (1 + passives.find(p => p.id === 'magnet').level * 0.3);
            for (let i = gems.length - 1; i >= 0; i--) {
                let g = gems[i];
                let dist = Math.hypot(player.worldX - g.x, player.worldY - g.y);
                if (dist < pickupRangeBase) {
                    let angle = Math.atan2(player.worldY - g.y, player.worldX - g.x);
                    g.x += Math.cos(angle) * 7;
                    g.y += Math.sin(angle) * 7;

                    if (dist < player.radius + 10) {
                        addExp(g.value);
                        gems.splice(i, 1);
                    }
                }
            }

            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.worldY -= 0.8 * dt * 60;
                ft.life -= dt;
                if (ft.life <= 0) floatTexts.splice(i, 1);
            }
        }

        function spawnEnemy() {
            let angle = Math.random() * Math.PI * 2;
            let spawnDist = Math.max(canvas.width, canvas.height) * 0.5 + Math.random() * 150;
            let x = player.worldX + Math.cos(angle) * spawnDist;
            let y = player.worldY + Math.sin(angle) * spawnDist;

            let typeRand = Math.random();
            let hp, speed, radius, color, expVal, damage;

            let isEarlyGame = gameTime < 120;
            let earlyMult = isEarlyGame ? 0.35 : 0.7;

            if (typeRand < 0.6) {
                hp = (20 + gameTime * 0.8) * earlyMult;
                speed = 1.0 * (isEarlyGame ? 0.8 : 1.0);
                radius = 16;
                color = '#ff5252';
                expVal = 1;
                damage = 8;
            } else if (typeRand < 0.9) {
                hp = (15 + gameTime * 0.5) * earlyMult;
                speed = 1.5 * (isEarlyGame ? 0.8 : 1.0);
                radius = 12;
                color = '#ffeb3b';
                expVal = 2;
                damage = 6;
            } else {
                hp = (60 + gameTime * 2.5) * earlyMult;
                speed = 0.7 * (isEarlyGame ? 0.8 : 1.0);
                radius = 30;
                color = '#ab47bc';
                expVal = 5;
                damage = 15;
            }

            enemies.push({ x, y, hp, maxHp: hp, speed, radius, color, expVal, damage });
        }

        function activateWeapon(weapon) {
            if (enemies.length === 0) return;

            let target = null;
            let minDist = Infinity;
            enemies.forEach(e => {
                let dist = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                if (dist < minDist && dist < weapon.range * 1.5) {
                    minDist = dist;
                    target = e;
                }
            });

            if (!target && enemies.length > 0) target = enemies[0];
            if (!target) return;

            if (weapon.id === 'fireball') {
                player.isAttacking = true;
                player.atkTimer = 0.25;

                let angle = Math.atan2(target.y - player.worldY, target.x - player.worldX);
                let count = weapon.level >= 3 ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    let offsetAngle = angle + (i === 0 ? 0 : (i % 2 === 0 ? 0.2 : -0.2));
                    bullets.push({
                        x: player.worldX,
                        y: player.worldY,
                        vx: Math.cos(offsetAngle) * 6,
                        vy: Math.sin(offsetAngle) * 6,
                        damage: weapon.damage + weapon.level * 8,
                        radius: 8,
                        life: 2.0,
                        color: '#ff7043',
                        pierce: false
                    });
                }
            } else if (weapon.id === 'lightning') {
                let affectedCount = 2 + weapon.level;
                let hitCount = 0;
                enemies.forEach(e => {
                    let dist = Math.hypot(player.worldX - e.x, player.worldY - e.y);
                    if (hitCount < affectedCount && dist < weapon.range) {
                        let powerBonus = 1 + passives.find(p => p.id === 'power').level * 0.15;
                        let finalDmg = Math.floor((weapon.damage + weapon.level * 10) * powerBonus);
                        e.hp -= finalDmg;
                        floatTexts.push({ worldX: e.x, worldY: e.y, text: finalDmg, color: '#40c4ff', life: 0.6 });
                        
                        particles.push({ type: 'lightning', worldX1: player.worldX, worldY1: player.worldY, worldX2: e.x, worldY2: e.y, life: 0.45 });

                        if (e.hp <= 0) {
                            killCount++;
                            gems.push({ x: e.x, y: e.y, value: e.expVal });
                        }
                        hitCount++;
                    }
                });
                enemies = enemies.filter(e => e.hp > 0);
            }
        }

        function addExp(val) {
            player.exp += val;
            if (player.exp >= player.maxExp) {
                player.exp -= player.maxExp;
                player.level++;
                player.maxExp = Math.floor(player.maxExp * 1.3);
                triggerLevelUp();
            }
            updateHUD();
        }

        function triggerLevelUp() {
            gamePaused = true;
            let availableChoices = [];
            weapons.forEach(w => {
                if (w.level < w.maxLevel) availableChoices.push({ type: 'weapon', item: w });
            });
            passives.forEach(p => {
                if (p.level < p.maxLevel) availableChoices.push({ type: 'passive', item: p });
            });

            availableChoices.sort(() => Math.random() - 0.5);
            let options = availableChoices.slice(0, 3);

            let container = document.getElementById('upgradeCards');
            container.innerHTML = '';

            if (options.length === 0) {
                player.hp = player.maxHp;
                gamePaused = false;
                return;
            }

            options.forEach(opt => {
                let card = document.createElement('div');
                card.className = 'upgrade-card';
                let title = opt.item.name;
                let desc = opt.type === 'weapon' ? `提升等級至 Lv.${opt.item.level + 1}` : opt.item.desc;
                if (opt.item.level === 0) title += ' (解鎖!)';

                card.innerHTML = `<h3>${title}</h3><p>${desc}</p>`;
                card.onclick = () => {
                    opt.item.level++;
                    player.hp = player.maxHp;
                    document.getElementById('upgradeScreen').classList.add('hidden');
                    gamePaused = false;
                    lastTimestamp = performance.now();
                    requestAnimationFrame(gameLoop);
                };
                container.appendChild(card);
            });

            document.getElementById('upgradeScreen').classList.remove('hidden');
        }

        function gameOver() {
            gameRunning = false;
            const minutes = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const seconds = String(Math.floor(gameTime % 60)).padStart(2, '0');
            document.getElementById('finalStats').innerText = `你撐過了 ${minutes}:${seconds}，擊敗了 ${killCount} 隻怪物。`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.scale(2.0, 2.0);

            let scaledWidth = canvas.width / 2.0;
            let scaledHeight = canvas.height / 2.0;
            let camX = player.worldX - scaledWidth / 2;
            let camY = player.worldY - scaledHeight / 2;

            // 繪製無限拼貼背景草地圖
            ctx.save();
            if (bgPattern) {
                ctx.fillStyle = bgPattern;
                ctx.translate(-camX, -camY);
                ctx.fillRect(camX, camY, scaledWidth, scaledHeight);
            } else {
                ctx.fillStyle = '#a8d5ba';
                ctx.fillRect(0, 0, scaledWidth, scaledHeight);
            }
            ctx.restore();

            // 經驗晶體
            gems.forEach(g => {
                let screenX = g.x - camX;
                let screenY = g.y - camY;
                if (screenX >= -20 && screenX <= scaledWidth + 20 && screenY >= -20 && screenY <= scaledHeight + 20) {
                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 敵人
            enemies.forEach(e => {
                let screenX = e.x - camX;
                let screenY = e.y - camY;
                if (screenX >= -50 && screenX <= scaledWidth + 50 && screenY >= -50 && screenY <= scaledHeight + 50) {
                    ctx.fillStyle = e.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, e.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });

            // 繪製主角圖片
            let playerScreenX = scaledWidth / 2;
            let playerScreenY = scaledHeight / 2;
            
            let currentImg = player.isAttacking ? playerAtkImage : playerIdleImages[player.currentFrame];

            if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {
                const renderSize = 64;
                ctx.save();
                ctx.translate(playerScreenX, playerScreenY);
                
                if (player.facingRight) {
                    ctx.scale(-1, 1);
                }

                ctx.drawImage(
                    currentImg,
                    -renderSize / 2,
                    -renderSize / 2,
                    renderSize,
                    renderSize
                );
                ctx.restore();
            } else {
                ctx.fillStyle = '#4cd137';
                ctx.beginPath();
                ctx.arc(playerScreenX, playerScreenY, player.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 主角下方的血量條
            let hpBarWidth = 40;
            let hpBarHeight = 6;
            let hpPercent = Math.max(0, player.hp / player.maxHp);
            let barX = playerScreenX - hpBarWidth / 2;
            let barY = playerScreenY + player.radius + 8;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(barX - 1, barY - 1, hpBarWidth + 2, hpBarHeight + 2);
            ctx.fillStyle = '#ff416c';
            ctx.fillRect(barX, barY, hpBarWidth, hpBarHeight);
            ctx.fillStyle = '#4cd137';
            ctx.fillRect(barX, barY, hpBarWidth * hpPercent, hpBarHeight);

            // 旋風劍刃
            let bladeW = weapons.find(w => w.id === 'blade');
            if (bladeW && bladeW.level > 0) {
                let bladeCount = 2 + bladeW.level;
                ctx.fillStyle = 'rgba(176, 190, 197, 0.8)';
                for (let i = 0; i < bladeCount; i++) {
                    let angle = (gameTime * 3) + (Math.PI * 2 / bladeCount) * i;
                    let bx = playerScreenX + Math.cos(angle) * 75;
                    let by = playerScreenY + Math.sin(angle) * 75;
                    ctx.beginPath();
                    ctx.arc(bx, by, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 子彈
            bullets.forEach(b => {
                let screenX = b.x - camX;
                let screenY = b.y - camY;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(screenX, screenY, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 閃電特效
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (p.type === 'lightning') {
                    let sx1 = p.worldX1 - camX;
                    let sy1 = p.worldY1 - camY;
                    let sx2 = p.worldX2 - camX;
                    let sy2 = p.worldY2 - camY;
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1);
                    ctx.lineTo(sx2, sy2);
                    ctx.stroke();
                    p.life -= 0.016;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            // 傷害數字
            floatTexts.forEach(ft => {
                let screenX = ft.worldX - camX;
                let screenY = ft.worldY - camY;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(ft.text, screenX, screenY);
            });

            ctx.restore();

            // 虛擬搖桿
            if (joystick.active) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 40, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(joystick.x, joystick.y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    </script>
</body>
