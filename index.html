<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Element Survivor - 元素倖存者</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #1a1a2e;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-stats {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .exp-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.5);
        }
        .exp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            transition: width 0.2s ease;
        }
        /* 彈窗樣式 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        /* 三選一升級卡片 */
        .upgrade-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            padding: 0 20px;
        }
        .upgrade-card {
            background: rgba(30, 30, 50, 0.9);
            border: 2px solid #4a4ae2;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .upgrade-card:hover {
            border-color: #00dbde;
            transform: translateY(-5px);
            background: rgba(40, 40, 70, 0.95);
            box-shadow: 0 10px 25px rgba(0, 219, 222, 0.3);
        }
        .upgrade-card h3 {
            margin-top: 0;
            color: #00dbde;
        }
        .upgrade-card p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="exp-bar-container">
        <div id="expBar" class="exp-bar"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-stats">
                <div>生存時間: <span id="timeDisplay">00:00</span></div>
                <div>擊殺數: <span id="killDisplay">0</span></div>
            </div>
            <div class="hud-stats" style="text-align: right;">
                <div>等級: <span id="levelDisplay">1</span></div>
                <div>生命值: <span id="hpDisplay">100/100</span></div>
            </div>
        </div>
    </div>

    <!-- 開始遊戲畫面 -->
    <div id="startScreen" class="overlay">
        <h1>Element Survivor</h1>
        <p>運用元素精靈的力量，在無盡的魔物浪潮中生存下去！<br>使用 <b>WASD / 方向鍵</b> 移動，或在手機上使用<b>虛擬搖桿</b>滑動。</p>
        <button class="btn" onclick="startGame()">開始冒險</button>
    </div>

    <!-- 升級三選一畫面 -->
    <div id="upgradeScreen" class="overlay hidden">
        <h1>升級！</h1>
        <p>選擇一項你的強化能力：</p>
        <div id="upgradeCards" class="upgrade-grid"></div>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">遊戲結束</h1>
        <p id="finalStats">你撐過了 00:00，擊敗了 0 隻怪物。</p>
        <button class="btn" onclick="restartGame()">重新挑戰</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 自動調整畫布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 遊戲狀態
        let gameRunning = false;
        let gamePaused = false;
        let gameTime = 0;
        let killCount = 0;
        let gameInterval;
        let lastTime = 0;

        // 玩家物件
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 16,
            speed: 3.5,
            maxHp: 100,
            hp: 100,
            level: 1,
            exp: 0,
            maxExp: 20,
            pickupRadius: 80,
            magnetPower: 1
        };

        // 玩家技能與被動
        let weapons = [
            { id: 'fireball', name: '烈焰球', level: 1, maxLevel: 5, cd: 1.2, timer: 0, damage: 25, range: 250 },
            { id: 'lightning', name: '閃電鏈', level: 0, maxLevel: 5, cd: 2.0, timer: 0, damage: 40, range: 300 },
            { id: 'blade', name: '旋風劍刃', level: 0, maxLevel: 5, cd: 3.5, timer: 0, damage: 15, range: 120 }
        ];

        let passives = [
            { id: 'haste', name: '疾風靴', level: 0, maxLevel: 5, desc: '移動速度提升 10%' },
            { id: 'power', name: '力量寶珠', level: 0, maxLevel: 5, desc: '攻擊傷害提升 15%' },
            { id: 'magnet', name: '吸引磁鐵', level: 0, maxLevel: 5, desc: '經驗吸收範圍擴大 30%' }
        ];

        // 實體陣列
        let enemies = [];
        let bullets = [];
        let particles = [];
        let gems = [];
        let floatTexts = [];

        // 輸入控制
        let keys = {};
        let joystick = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0 };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // 觸控虛擬搖桿支援
        window.addEventListener('pointerdown', e => {
            if (!gameRunning || gamePaused) return;
            joystick.active = true;
            joystick.id = e.pointerId;
            joystick.startX = e.clientX;
            joystick.startY = e.clientY;
            joystick.x = e.clientX;
            joystick.y = e.clientY;
        });

        window.addEventListener('pointermove', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.x = e.clientX;
                joystick.y = e.clientY;
            }
        });

        window.addEventListener('pointerup', e => {
            if (joystick.active && e.pointerId === joystick.id) {
                joystick.active = false;
            }
        });

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            resetGame();
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;
            player.level = 1;
            player.exp = 0;
            player.maxExp = 20;
            gameTime = 0;
            killCount = 0;
            enemies = [];
            bullets = [];
            particles = [];
            gems = [];
            floatTexts = [];

            weapons.forEach(w => {
                w.level = (w.id === 'fireball' ? 1 : 0);
                w.timer = 0;
            });
            passives.forEach(p => p.level = 0);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('levelDisplay').innerText = player.level;
            document.getElementById('hpDisplay').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('killDisplay').innerText = killCount;
            const minutes = String(Math.floor(gameTime / 60)).padStart(2, '0');
            const seconds = String(Math.floor(gameTime % 60)).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${minutes}:${seconds}`;
            
            const expPercent = (player.exp / player.maxExp) * 100;
            document
